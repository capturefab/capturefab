[package]
name = "capturefab"
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
description = "Camera capture command-line tool for people, scripts and AI agents: GigE Vision, USB3 Vision, GenICam, webcams and streams"
license = "MIT"
repository = "https://github.com/capturefab/capturefab"

[features]
default = ["usb", "jpeg", "videotoolbox", "nvjpeg", "vaapi", "keychain", "shell"]
usb = ["dep:nusb"]
# libjpeg-turbo, built from source with its NEON/SSE2/AVX2 SIMD (x86 needs NASM).
jpeg = ["dep:turbojpeg"]
# Apple's JPEG engine through VideoToolbox, a system framework, for color
# stills on macOS (`CAPTUREFAB_JPEG`); a no-op elsewhere. libjpeg-turbo
# checks its output.
videotoolbox = ["jpeg"]
# GPU JPEG encoders on Linux, NVIDIA's nvJPEG (CUDA) and VA-API (Intel and
# other drivers with JPEG encoding), in a helper process that maps the
# frames' shared memory (`CAPTUREFAB_JPEG`). Their libraries are loaded when
# a host has the device, so a build needs no SDK; libjpeg-turbo (the jpeg
# feature) checks their output. No-ops elsewhere.
nvjpeg = []
vaapi = []
# OS credential store (Keychain / Credential Manager / Secret Service) for
# saved camera sign-ins.
keychain = ["dep:keyring"]
# Line editing, history and tab completion in `capturefab shell`; without it
# the shell reads plain lines.
shell = ["dep:rustyline"]
# Count where camera frames are copied and the large allocations made, and
# write each camera worker's and GPU JPEG helper's counts to
# $CAPTUREFAB_COPY_REPORT (tests/copies.rs). Off in every release build.
copy-audit = []

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
roxmltree = "0.20"
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }
png = "0.17"
if-addrs = "0.13"
socket2 = { version = "0.6", features = ["all"] }
getrandom = "0.3"
nusb = { version = "0.2.7", optional = true }
base64 = "0.22"
sha1 = "0.10"
md-5 = "0.10"
sha2 = "0.10"
fs2 = "0.4"
# Lossless storage of the bundled executable; PNG/ZIP already use this backend.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
turbojpeg = { version = "1.5", optional = true, default-features = false, features = ["cmake", "require-simd"] }
keyring = { version = "4.2", optional = true }
zeroize = "1"
rustyline = { version = "18", optional = true, default-features = false, features = ["with-file-history"] }

# Inheritable pipes (a detached session's ready line, a worker's stdout
# capture), the job objects that hold camera workers and what they start,
# a worker's private protocol handle, publishing a capture without
# replacing a file (MoveFileExW), and the memory left (GlobalMemoryStatusEx).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }

# Ctrl-C, Ctrl-Break and a closed console where there are no Unix signals,
# which go through libc.
[target.'cfg(not(unix))'.dependencies]
ctrlc = { version = "3.4", features = ["termination"] }

# Host facts for doctor and memory-scaled queues (sysctl, statfs, statvfs,
# access), process groups and signals
# for camera workers, and descriptor inheritance for a worker's stdout
# capture.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ARMv8 SHA-2 instructions for storage integrity hashing. x86 already selects
# SHA-NI at runtime without this; the asm crate does not assemble under MSVC.
[target.'cfg(all(target_arch = "aarch64", not(target_env = "msvc")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Digest of the embedded FFmpeg, which names its extracted copy.
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

[[bench]]
name = "runtime"
harness = false
