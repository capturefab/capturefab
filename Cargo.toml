[package]
name = "capturefab"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "Rust camera workbench for GenICam GigE Vision and USB3 Vision"
license = "MIT"
repository = "https://github.com/capturefab/capturefab"

[features]
default = ["usb", "jpeg", "keychain"]
usb = ["dep:nusb"]
# libjpeg-turbo, built from source with its NEON/SSE2/AVX2 SIMD (x86 needs NASM).
jpeg = ["dep:turbojpeg"]
# OS credential store (Keychain / Credential Manager / Secret Service) for
# saved camera sign-ins.
keychain = ["dep:keyring"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
roxmltree = "0.20"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
png = "0.17"
if-addrs = "0.13"
socket2 = { version = "0.6", features = ["all"] }
getrandom = "0.3"
nusb = { version = "0.2.7", optional = true }
memmap2 = "0.9"
base64 = "0.22"
sha1 = "0.10"
md-5 = "0.10"
sha2 = "0.10"
fs2 = "0.4"
# Lossless storage of the bundled executable; PNG/ZIP already use this backend.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
turbojpeg = { version = "1.5", optional = true, default-features = false, features = ["cmake", "require-simd"] }
keyring = { version = "4.2", optional = true }
zeroize = "1"

# Share modes for the frame ring's backing file, and the inheritable pipe
# a detached session reports ready on.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Ctrl-C, Ctrl-Break and a closed console where there are no Unix signals,
# which go through libc.
[target.'cfg(not(unix))'.dependencies]
ctrlc = { version = "3.4", features = ["termination"] }

# Host facts for doctor (sysctl, statfs, access), and anonymous shared memory
# for frame rings (memfd_create, shm_open) with descriptor inheritance by
# camera workers.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ARMv8 SHA-2 instructions for storage integrity hashing. x86 already selects
# SHA-NI at runtime without this; the asm crate does not assemble under MSVC.
[target.'cfg(all(target_arch = "aarch64", not(target_env = "msvc")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Digest of the embedded FFmpeg, which names its extracted copy.
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

[[bench]]
name = "runtime"
harness = false
