[package]
name = "capturefab-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Browser WASM controller for a headless Capturefab session"
license = "MIT"

# This is deliberately separate from the native crate: no camera drivers,
# native UI, filesystem, processes, or native networking enter the WASM build.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.106"
serde_json = "1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "Blob", "Document", "Element", "Event", "EventTarget", "Headers",
    "HtmlElement", "HtmlImageElement", "HtmlInputElement",
    "HtmlSelectElement", "Node", "NodeList", "Request",
    "RequestCache", "RequestCredentials", "RequestInit", "RequestMode",
    "Response", "Url", "Window",
] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"

[workspace]
