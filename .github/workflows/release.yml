name: Release

on:
  push:
    tags: ['v*-rc.*']
    # Merging a pull request that raises the version (see prepare-release.yml)
    # creates an RC draft and promotes it after validation. Path filters do not apply to tags.
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      # Build every target (false for a push to main that is not a release).
      build: ${{ steps.version.outputs.build }}
      # Draft, attest and publish (false for a dry run from a branch).
      release: ${{ steps.version.outputs.release }}
      azure-signing: ${{ steps.version.outputs.release == 'true' && vars.CAPTUREFAB_WINDOWS_SIGNING == 'azure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          build=true release=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(python3 scripts/release.py version)
            suffix=${GITHUB_REF_NAME#"v$version-rc."}
            if ! [[ "$GITHUB_REF_NAME" == "v$version-rc."* && "$suffix" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Tag must be a -rc.N candidate matching Cargo.toml"
              exit 1
            fi
            release=true
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$(python3 scripts/release.py version)
            previous=
            if git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null; then
              previous=$(git show "$BEFORE:Cargo.toml" | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1)
            fi
            if [ -z "$previous" ] || [ "$previous" = "$version" ]; then
              # Unchanged, or unknown after a force push: never release by accident.
              build=false
              echo "Cargo.toml changed without a new version ($previous -> $version); nothing to release." >> "$GITHUB_STEP_SUMMARY"
            elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              build=false
              echo "v$version is already tagged; no new release from this version bump." >> "$GITHUB_STEP_SUMMARY"
            else
              release=true
            fi
          else
            # A manual run from a branch is a dry run that only leaves artifacts.
            version=$(python3 scripts/release.py version)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          { echo "build=$build"; echo "release=$release"; } >> "$GITHUB_OUTPUT"
      - name: Require Apple signing and notarization for releases
        if: steps.version.outputs.release == 'true' && vars.CAPTUREFAB_ALLOW_UNSIGNED_MACOS != 'true'
        env:
          MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_CERTIFICATE_P12_PASSWORD != '' }}
          MACOS_NOTARIZING: ${{ secrets.MACOS_NOTARY_KEY != '' && secrets.MACOS_NOTARY_KEY_ID != '' && secrets.MACOS_NOTARY_ISSUER != '' }}
        run: |
          # Unsigned or unnotarized macOS downloads are blocked by Gatekeeper.
          if [ "$MACOS_SIGNING" != true ] || [ "$MACOS_NOTARIZING" != true ]; then
            echo "::error::Releases need the MACOS_CERTIFICATE_* and MACOS_NOTARY_* secrets (docs/release.md). Set the repository variable CAPTUREFAB_ALLOW_UNSIGNED_MACOS=true to release unsigned macOS builds anyway."
            exit 1
          fi
      - name: Require the download bucket for releases
        if: steps.version.outputs.release == 'true'
        env:
          CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          # Releases are distributed from capturefab.com/download, not from this build system.
          if [ "$CLOUDFLARE" != true ]; then
            echo "::error::Releases need the CLOUDFLARE_API_TOKEN secret with R2 write access to the download bucket (docs/release.md)."
            exit 1
          fi
      - name: Check Windows signing configuration
        if: steps.version.outputs.build == 'true'
        env:
          PROVIDER: ${{ vars.CAPTUREFAB_WINDOWS_SIGNING }}
          RELEASE: ${{ steps.version.outputs.release }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          case "$PROVIDER" in
            '') exit 0 ;; # Preserve the optional PFX signing path.
            azure) ;;
            *) echo '::error::CAPTUREFAB_WINDOWS_SIGNING must be azure or unset (docs/release.md).'; exit 1 ;;
          esac
          # Branch dry runs build unsigned Windows packages without Azure access.
          if [ "$RELEASE" != true ]; then exit 0; fi
          missing=false
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_ARTIFACT_SIGNING_ENDPOINT AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE; do
            if [ -z "${!name}" ]; then
              echo "::error::Azure signing requires the repository variable $name (docs/release.md)."
              missing=true
            fi
          done
          if [ "$missing" = true ]; then exit 1; fi
          if ! [[ "$AZURE_ARTIFACT_SIGNING_ENDPOINT" == https://* ]]; then
            echo '::error::AZURE_ARTIFACT_SIGNING_ENDPOINT must use HTTPS.'
            exit 1
          fi

  candidate:
    name: Create draft release candidate
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.candidate.outputs.release_id }}
      candidate-tag: ${{ steps.candidate.outputs.candidate_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-candidate.py create --repository "$GITHUB_REPOSITORY" --version "${{ needs.version.outputs.version }}" --sha "$GITHUB_SHA"

  validate:
    name: Test release candidate
    needs: [version, candidate]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.build == 'true' && (needs.candidate.result == 'success' || needs.version.outputs.release != 'true') }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  web-client:
    name: Build the browser client
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal -t wasm32-unknown-unknown --no-self-update && rustup default stable
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: sh web-client/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-client
          path: web-client/dist
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs: [version, candidate, web-client]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.build == 'true' && needs.web-client.result == 'success' && (needs.candidate.result == 'success' || needs.version.outputs.release != 'true') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux_2_28 (AlmaLinux 8, GCC 14) links against glibc 2.28: RHEL,
          # Rocky and Alma 8, Debian 10, Ubuntu 18.10 and newer, Jetson Linux R34.
          - { os: linux, arch: x86_64, target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, container: 'quay.io/pypa/manylinux_2_28_x86_64:latest', python: /opt/python/cp312-cp312/bin/python3 }
          - { os: linux, arch: aarch64, target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, container: 'quay.io/pypa/manylinux_2_28_aarch64:latest', python: /opt/python/cp312-cp312/bin/python3 }
          - { os: macos, arch: aarch64, target: aarch64-apple-darwin, runner: macos-15, macos: '11.0' }
          - { os: macos, arch: x86_64, target: x86_64-apple-darwin, runner: macos-15-intel, macos: '10.15' }
          # FFmpeg builds with MinGW: GCC on x64, LLVM on ARM64 (MSYS2 has no
          # ARM64 GCC).
          - { os: windows, arch: x86_64, target: x86_64-pc-windows-msvc, runner: windows-2025, msystem: UCRT64 }
          - { os: windows, arch: aarch64, target: aarch64-pc-windows-msvc, runner: windows-11-arm, msystem: CLANGARM64 }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PYTHON: ${{ matrix.python || (matrix.os == 'windows' && 'python') || 'python3' }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_OS: ${{ matrix.os }}
      RELEASE_ARCH: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos }}
      MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      WINDOWS_SIGNING: ${{ vars.CAPTUREFAB_WINDOWS_SIGNING != 'azure' && secrets.WINDOWS_CERTIFICATE_PFX_BASE64 != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          # The image has GCC 14, CMake, Git, Perl and CPython; OpenSSL's
          # configure needs these Perl modules, and x86 SIMD needs NASM.
          dnf install -y perl-IPC-Cmd perl-Data-Dumper perl-Time-Piece xz
          if [ "$(uname -m)" = x86_64 ]; then dnf install -y nasm; fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install NASM
        if: runner.os == 'macOS' && matrix.arch == 'x86_64'
        run: brew install nasm
      - name: Install NASM for libjpeg-turbo SIMD
        if: runner.os == 'Windows' && matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          Add-Content $env:GITHUB_PATH 'C:\Program Files\NASM'
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With web-client/dist in place, release.py builds each target with
      # the embedded-web feature and CAPTUREFAB_WEB_DIST, so serve --listen
      # needs no --web-dir.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-client
          path: web-client/dist
      - name: Check the browser client to embed
        run: test -f web-client/dist/index.html && test -f web-client/dist/capturefab_web_bg.wasm
      # The Windows ARM64 image does not ship rustup.
      - name: Install rustup
        if: runner.os == 'Windows' && matrix.arch == 'aarch64'
        run: |
          curl --proto '=https' --tlsv1.2 -sSfLo "$RUNNER_TEMP/rustup-init.exe" https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
          "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal --default-toolchain none
          echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: runner.os == 'Windows'
        with:
          msystem: ${{ matrix.msystem }}
          install: curl diffutils make perl tar xz
          pacboy: cmake:p ninja:p pkgconf:p ${{ matrix.arch == 'aarch64' && 'clang:p' || 'gcc:p nasm:p' }}
      - id: ffmpeg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ffmpeg-bundle
          key: ffmpeg-${{ matrix.target }}-${{ matrix.container || matrix.runner }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'third_party/**') }}
      - name: Build FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: BUILD_DIR="$RUNNER_TEMP/ffmpeg-build" scripts/build-ffmpeg.sh target/ffmpeg-bundle
      - name: Build FFmpeg with MinGW
        if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        env:
          TARGET_OS: mingw32
          TARGET_ARCH: ${{ matrix.arch }}
          CC: ${{ matrix.arch == 'aarch64' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.arch == 'aarch64' && 'clang++' || 'g++' }}
          # Empty selects the script's default (ar, ranlib, strip, objdump).
          AR: ${{ matrix.arch == 'aarch64' && 'llvm-ar' || '' }}
          RANLIB: ${{ matrix.arch == 'aarch64' && 'llvm-ranlib' || '' }}
          STRIP: ${{ matrix.arch == 'aarch64' && 'llvm-strip' || '' }}
          OBJDUMP: ${{ matrix.arch == 'aarch64' && 'llvm-objdump' || '' }}
        run: BUILD_DIR="$(cygpath -u "$RUNNER_TEMP")/ffmpeg-build" scripts/build-ffmpeg.sh target/ffmpeg-bundle
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ffmpeg-bundle
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}
      - name: Build, smoke-test and package
        run: '"$PYTHON" scripts/release.py build --version "$VERSION" --target "$RELEASE_TARGET" --os "$RELEASE_OS" --arch "$RELEASE_ARCH" --ffmpeg-bundle target/ffmpeg-bundle --output dist'
      - name: Import Apple signing identity
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # Accept line-wrapped base64 and a password pasted with a trailing newline.
          p12="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | tr -d '[:space:]' | base64 --decode > "$p12"
          p12_password=${MACOS_CERTIFICATE_P12_PASSWORD%$'\n'}
          p12_password=${p12_password%$'\r'}
          if ! security import "$p12" -k "$keychain" -f pkcs12 -P "$p12_password" -T /usr/bin/codesign; then
            # A digest of the encrypted file identifies which export the secret holds.
            echo "::error::MACOS_CERTIFICATE_P12_PASSWORD does not open MACOS_CERTIFICATE_P12_BASE64 ($(wc -c < "$p12" | tr -d ' ') bytes, SHA-256 $(shasum -a 256 < "$p12" | cut -c1-64)). Compare with shasum -a 256 of the exported .p12 and set both secrets from the same export."
            rm "$p12"
            exit 1
          fi
          rm "$p12"
          # Exported identities usually omit Apple's intermediate, without which
          # the identity is untrusted; pin it rather than rely on the runner image.
          curl --proto '=https' --tlsv1.2 -sSfLo "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          # Images that already carry it report a duplicate; the validity check below decides.
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Keep the existing keychains searchable after the signing keychain.
          eval "set -- $(security list-keychains -d user | tr '\n' ' ')"
          security list-keychains -d user -s "$keychain" "$@"
          security default-keychain -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / && length($2) == 40 {print $2; exit}')
          if [ -z "$identity" ]; then
            security find-identity -p codesigning "$keychain"
            echo "::error::MACOS_CERTIFICATE_P12_BASE64 holds no valid Developer ID Application identity"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$MACOS_NOTARY_KEY" ]; then
            # Accept the .p8 as saved, with CRLF endings, base64-encoded, or as
            # its bare body, and fail clearly when it is not an EC private key.
            key=$(printf '%s' "$MACOS_NOTARY_KEY" | tr -d '\r')
            case $key in
              *'-----BEGIN PRIVATE KEY-----'*) ;;
              *)
                body=$(printf '%s' "$key" | tr -d '[:space:]')
                decoded=$(printf '%s' "$body" | base64 --decode 2>/dev/null || true)
                case $decoded in
                  *'-----BEGIN PRIVATE KEY-----'*) key=$decoded ;;
                  *) key=$(printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n' "$(printf '%s' "$body" | fold -w 64)") ;;
                esac ;;
            esac
            printf '%s\n' "$key" > "$RUNNER_TEMP/notary.p8"
            if ! openssl pkey -in "$RUNNER_TEMP/notary.p8" -noout 2>/dev/null; then
              rm "$RUNNER_TEMP/notary.p8"
              echo "::error::MACOS_NOTARY_KEY is not an App Store Connect API private key; set it from the AuthKey_KEYID.p8 file: gh secret set MACOS_NOTARY_KEY < AuthKey_KEYID.p8"
              exit 1
            fi
            xcrun notarytool store-credentials capturefab-notary --key "$RUNNER_TEMP/notary.p8" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER"
            rm "$RUNNER_TEMP/notary.p8"
            echo "MACOS_NOTARY_PROFILE=capturefab-notary" >> "$GITHUB_ENV"
          fi
      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "WINDOWS_SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "WINDOWS_CERTIFICATE_PFX=$pfx" >> $env:GITHUB_ENV
      - name: Sign and repackage
        if: env.MACOS_SIGN_IDENTITY != '' || env.WINDOWS_CERTIFICATE_PFX != ''
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: '"$PYTHON" scripts/release.py build --repackage --version "$VERSION" --target "$RELEASE_TARGET" --os "$RELEASE_OS" --arch "$RELEASE_ARCH" --ffmpeg-bundle target/ffmpeg-bundle --output dist'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          # Original Windows packages never reach assembly when Azure is required.
          name: ${{ needs.version.outputs.azure-signing == 'true' && matrix.os == 'windows' && 'unsigned' || 'build' }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist
          if-no-files-found: ignore
          retention-days: 7

  sign-windows:
    name: Azure sign Windows x64 and ARM64
    needs: [version, build]
    if: ${{ !cancelled() && needs.version.outputs.azure-signing == 'true' && needs.build.result == 'success' }}
    # The Azure action supports x64 runners, and can sign either PE architecture.
    # Native smoke tests already ran in build; no application or compiler runs here.
    runs-on: windows-2025
    environment: windows-signing
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      AZURE_CORE_OUTPUT: none
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unsigned-windows-*
          path: dist/windows-builds
      - name: Prepare verified native Windows executables
        run: |
          python scripts/sign-windows.py prepare --version "$env:VERSION" --input dist/windows-builds --output dist/windows-signing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw 'Windows SDK signtool.exe was not found' }
          "WINDOWS_SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign and timestamp Windows executables
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\windows-signing
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Capturefab
          description-url: https://capturefab.com
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
      - name: Verify signatures and repackage without rebuilding
        run: python scripts/sign-windows.py finish --version "$env:VERSION" --input dist/windows-builds --signed dist/windows-signing --output dist/signed-windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-windows-signed
          path: dist/signed-windows
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble release
    needs: [version, build, sign-windows]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.build == 'true' && (needs.sign-windows.result == 'success' || (needs.version.outputs.azure-signing != 'true' && needs.sign-windows.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GPG_SIGNING: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: dist/builds
      - name: Import checksum signing key
        id: gpg
        if: env.GPG_SIGNING == 'true'
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')" >> "$GITHUB_OUTPUT"
      - name: Assemble checksums, manifest, notes and corresponding source
        env:
          GPG_KEY: ${{ steps.gpg.outputs.fingerprint }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          PROVENANCE: ${{ vars.CAPTUREFAB_ATTEST != 'false' && needs.version.outputs.release == 'true' }}
        run: |
          set -- --version "$VERSION" --input dist/builds --output dist/release --repository "$GITHUB_REPOSITORY" --download-base "https://capturefab.com/download/v$VERSION"
          if [ -n "$GPG_KEY" ]; then set -- "$@" --gpg-key "$GPG_KEY"; fi
          if [ "$PROVENANCE" = true ]; then set -- "$@" --provenance; fi
          # The in-app update check shows these lines.
          if [ -f "docs/releases/$VERSION.txt" ]; then set -- "$@" --highlights "docs/releases/$VERSION.txt"; fi
          python3 scripts/release.py assemble "$@"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/release
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest build provenance and SBOM
    needs: [version, assemble]
    # On by default for releases; set CAPTUREFAB_ATTEST=false to turn off. The
    # attestations, including the repository identity, are recorded in the
    # public Sigstore transparency log.
    if: ${{ !cancelled() && needs.version.outputs.release == 'true' && needs.assemble.result == 'success' && vars.CAPTUREFAB_ATTEST != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist/release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/release/SHA256SUMS
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-checksums: dist/release/SHA256SUMS
          sbom-path: dist/release/capturefab-${{ needs.version.outputs.version }}-sbom.cdx.json

  draft:
    name: Upload to a draft GitHub release
    needs: [version, candidate, assemble, attest]
    if: ${{ !cancelled() && needs.version.outputs.release == 'true' && needs.candidate.result == 'success' && needs.assemble.result == 'success' && (needs.attest.result == 'success' || (vars.CAPTUREFAB_ATTEST == 'false' && needs.attest.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist/release
      - name: Combine generated and build notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          CANDIDATE_TAG: ${{ needs.candidate.outputs.candidate-tag }}
        run: |
          # GitHub's notes list merged pull requests since the previous tag,
          # grouped by label as .github/release.yml configures.
          generated=$(gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$CANDIDATE_TAG" -f target_commitish="$GITHUB_SHA" --jq .body) || generated=''
          {
            if [ -n "$generated" ]; then printf '%s\n\n' "$generated"; fi
            echo '## Downloads and verification'
            echo
            tail -n +2 dist/release/release-notes.md
          } > "$RUNNER_TEMP/notes.md"
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          CANDIDATE_TAG: ${{ needs.candidate.outputs.candidate-tag }}
        run: |
          tag="$CANDIDATE_TAG"
          notes="$RUNNER_TEMP/notes.md"
          files=()
          for file in dist/release/*; do
            if [ "$file" != dist/release/release-notes.md ]; then files+=("$file"); fi
          done
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          case $state in
            true)
              existing=$(gh release view "$tag" --json assets --jq '.assets[].name')
              while IFS= read -r asset; do
                case $asset in
                  capturefab-"$VERSION"-*|SHA256SUMS.asc) ;;
                  *) continue ;;
                esac
                retained=false
                for file in "${files[@]}"; do
                  if [ "${file##*/}" = "$asset" ]; then retained=true; break; fi
                done
                if [ "$retained" = false ]; then gh release delete-asset "$tag" "$asset" --yes; fi
              done <<< "$existing"
              gh release edit "$tag" --notes-file "$notes"
              gh release upload "$tag" "${files[@]}" --clobber ;;
            *)
              echo "::error::$tag candidate draft is missing or already published; refusing to upload"
              exit 1 ;;
          esac
          echo "Draft: $(gh release view "$tag" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Promote successful release candidate
    needs: [version, candidate, validate, build, sign-windows, assemble, attest, draft]
    if: ${{ !cancelled() && needs.candidate.result == 'success' && needs.validate.result == 'success' && needs.build.result == 'success' && (needs.sign-windows.result == 'success' || (needs.version.outputs.azure-signing != 'true' && needs.sign-windows.result == 'skipped')) && needs.assemble.result == 'success' && needs.draft.result == 'success' && (needs.attest.result == 'success' || (vars.CAPTUREFAB_ATTEST == 'false' && needs.attest.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist/release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: site
      # Before promotion, so that the published manifest never names a missing file.
      - name: Upload the downloads to capturefab.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CAPTUREFAB_DOWNLOAD_BUCKET: ${{ vars.CAPTUREFAB_DOWNLOAD_BUCKET }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -- --version "$VERSION" --input dist/release
          # Until promotion creates the final tag, objects that differ are an earlier
          # failed candidate's; after it, the version's files never change.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then set -- "$@" --unpublished; fi
          python3 scripts/publish-downloads.py "$@"
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_ID: ${{ needs.candidate.outputs.release-id }}
        run: python3 scripts/release-candidate.py promote --repository "$GITHUB_REPOSITORY" --version "$VERSION" --sha "$GITHUB_SHA" --release-id "$RELEASE_ID"

  site:
    name: Update the downloads page
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.outputs.published == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # Starts the Pages workflow, which deploys from the default branch.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist/release
      - name: Merge the release into web/
        run: |
          python3 scripts/site-release.py --merge dist/release/releases.json
          python3 scripts/test-site.py
      - name: Commit to the default branch, or open a pull request
        env:
          PUBLISH_SITE: ${{ vars.CAPTUREFAB_PUBLISH_SITE }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web
          if git diff --cached --quiet; then echo "web/ already lists v$VERSION."; exit 0; fi
          git commit -m "Publish v$VERSION downloads"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          if git -c http.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:$DEFAULT_BRANCH"; then
            echo "Updated web/ on $DEFAULT_BRANCH." >> "$GITHUB_STEP_SUMMARY"
            if [ "$PUBLISH_SITE" = true ]; then
              gh workflow run pages.yml --ref "$DEFAULT_BRANCH"
              echo "Started the Pages deployment." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            # A protected branch: propose the change instead.
            branch="site/v$VERSION"
            git -c http.extraheader="AUTHORIZATION: basic $auth" push --force origin "HEAD:refs/heads/$branch"
            url=$(gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "Publish v$VERSION downloads" --label release --body "Adds v$VERSION to web/releases.json, the downloads page and the feed. Run the Pages workflow after merging.") \
              && echo "Opened $url" >> "$GITHUB_STEP_SUMMARY" \
              || echo "::warning::Pushed $branch; open a pull request from it to update the site."
          fi
