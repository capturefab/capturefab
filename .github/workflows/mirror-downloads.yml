name: Mirror downloads

# Copies the files of a release published before capturefab.com/download existed
# into the download bucket. Until then the site's Worker reads them from the
# release assets, so this only moves storage; the public links do not change.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to copy, for example 0.4.0
        required: true

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Copy v${{ inputs.version }} to the download bucket
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: site
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release download "v${VERSION#v}" --repo "$GITHUB_REPOSITORY" --dir dist/release
      - name: Verify and upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CAPTUREFAB_DOWNLOAD_BUCKET: ${{ vars.CAPTUREFAB_DOWNLOAD_BUCKET }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/publish-downloads.py --version "$VERSION" --input dist/release
