name: Pages

on:
  push:
    branches: [main]
    paths:
      - web/**
      - site/**
      - scripts/test-site.py
      - scripts/docs-search.py
      - scripts/test-docs-search.js
      - scripts/test-site-ui.js
      - scripts/site-release.py
      - scripts/publish-downloads.py
      - scripts/site-guides.py
      - docs/*.md
      - examples/workflows/**
      - scripts/install-template.*
      - scripts/build-try.py
      - scripts/try-tests/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    if: vars.CAPTUREFAB_PUBLISH_SITE == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/test-site.py
      - run: node --check web/app.js
      - run: node --check web/docs.js
      - run: node scripts/test-docs-search.js
      - run: node scripts/test-site-ui.js
      - run: for f in web/try/*.mjs; do node --check "$f"; done
      # The committed web/try/capturefab.wasm against the golden results, before it is published.
      - run: node --test scripts/try-tests/*.test.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: site
      # The /download/* Worker; Node 24 runs its TypeScript directly.
      - run: node --test site/worker.test.mjs
      # Upload before deploying the manifest that advertises this release. A failed
      # upload leaves the deployed site unchanged; rerunning Pages retries it.
      - name: Download the latest advertised release
        id: downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("web/releases.json")).get("latest") or "")')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then exit 0; fi
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --dir dist/release
      - name: Verify and upload the downloads
        if: steps.downloads.outputs.version != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CAPTUREFAB_DOWNLOAD_BUCKET: ${{ vars.CAPTUREFAB_DOWNLOAD_BUCKET }}
          VERSION: ${{ steps.downloads.outputs.version }}
        run: python3 scripts/publish-downloads.py --version "$VERSION" --input dist/release
      - run: npx cf deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
