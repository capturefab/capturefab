name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal -c clippy -c rustfmt --no-self-update && rustup default stable
      - name: Install NASM for libjpeg-turbo SIMD
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm
      - uses: ./.github/actions/setup-ffmpeg
        with:
          runner-image: ubuntu-24.04
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every architecture a release ships, on free hosted runners.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ARM64 images do not all ship rustup.
      - name: Install rustup if missing
        shell: bash
        run: |
          if command -v rustup >/dev/null; then exit 0; fi
          if [ "$RUNNER_OS" = Windows ]; then
            arch=$([ "$RUNNER_ARCH" = ARM64 ] && echo aarch64 || echo x86_64)
            curl --proto '=https' --tlsv1.2 -sSfLo "$RUNNER_TEMP/rustup-init.exe" "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe"
            "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal --default-toolchain none
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      # x86 SIMD in libjpeg-turbo is NASM assembly; ARM uses NEON intrinsics.
      - name: Install NASM for libjpeg-turbo SIMD
        if: runner.os == 'Linux' && runner.arch == 'X64'
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm
      - name: Install NASM for libjpeg-turbo SIMD
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: brew install nasm
      - name: Install NASM for libjpeg-turbo SIMD
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          Add-Content $env:GITHUB_PATH 'C:\Program Files\NASM'
      - uses: ./.github/actions/setup-ffmpeg
        with:
          runner-image: ${{ matrix.os }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      # Every test binary runs, so one failure does not hide the rest.
      - run: cargo test --locked --no-fail-fast
      # The command reference is generated from this binary's schema; the
      # committed snapshot must match it.
      - name: Command reference matches the CLI
        if: matrix.os == 'ubuntu-24.04'
        run: python3 scripts/site-reference.py --check --binary target/debug/capturefab
      # What this build reports on the runner; informational, never fails.
      - name: Report build features
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CAPTUREFAB_SESSION_DIR: ${{ runner.temp }}/capturefab-sessions
        run: |
          {
            echo "### ${{ matrix.os }} ($RUNNER_ARCH)"
            echo '```json'
            python=$(command -v python3 || command -v python)
            cargo run --locked --quiet -- --json doctor | "$python" -c 'import json, sys; r = json.load(sys.stdin); print(json.dumps({k: r[k] for k in ("os", "arch", "features", "version")}, indent=2))' || echo '"doctor failed"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

  features:
    name: Build feature subsets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Install NASM for libjpeg-turbo SIMD
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm
      - uses: ./.github/actions/setup-ffmpeg
        with:
          runner-image: ubuntu-24.04
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      # Builds without optional features keep compiling, alone and with each one.
      - run: cargo check --locked --no-default-features
      - run: cargo check --locked --no-default-features --features usb
      - run: cargo check --locked --no-default-features --features keychain

  site:
    name: Site and release scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/test-site.py
      - run: node --check web/app.js
      - run: node --check web/docs.js
      - run: node scripts/test-docs-search.js
      - run: node scripts/test-site-ui.js
      - run: python3 -m unittest discover -s scripts -v
      # The site's /download/* Worker is TypeScript, which Node 24 runs directly.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --test site/worker.test.mjs
